name: Something is broken
description: The app did something it should not, or did not do something it should.
labels: [bug]
body:
  - type: input
    id: version
    attributes:
      label: HappyVibe version
      description: The number at the top of the Changelog page (Settings → This app → Changelog).
      placeholder: "0.2.0"
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options: [macOS, Windows, Linux (AppImage), Linux (.deb)]
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: "1. Open a workspace\n2. …"
  - type: textarea
    id: extra
    attributes:
      label: Anything else
      description: Model and provider, a screenshot, the relevant Audit log rows. Please remove anything private first.
