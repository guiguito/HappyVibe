appId: dev.happyvibe.app
productName: HappyVibe
directories:
  output: release
files:
  - out/**
  # §37: the renderer's source maps are emitted (sourcemap: 'hidden') so a crash
  # report can be symbolicated locally, but they never ship — a map is the
  # unminified source, and the artifact is public.
  - "!out/**/*.map"
extraResources:
  - from: pi-runtime
    to: pi-runtime
mac:
  # §38: the zip is what Squirrel.Mac updates FROM (plus its .blockmap for delta
  # downloads); the dmg is only for the first install. A dmg-only build uploads
  # fine and updates nobody.
  target: [dmg, zip]
  # Stays null so a laptop build is ad-hoc and never publishes. scripts/release-mac.mjs
  # overrides it on the CLI with the Developer ID (PRD §4: signing is local).
  identity: null
  # §27: all three of these are required for the microphone, and the third
  # lives in build/afterPack.mjs. Any two alone ship a bundle with no mic
  # access, and the failure is silent — a live track that yields only zeros.
  hardenedRuntime: true
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  extendInfo:
    NSMicrophoneUsageDescription: >-
      HappyVibe transcribes your speech on this device to type into
      the composer. Your audio never leaves your computer.
# Windows round (2026-09-14): we never rebuild a native module. node-pty is N-API
# (one prebuilt binary serves Node AND Electron) and sherpa-onnx-node resolves a
# prebuilt per-platform sibling package, so there is nothing to compile — while
# leaving this on means electron-builder asks for Visual Studio on Windows and the
# build dies there. Pinned by tests/native-modules.test.ts.
npmRebuild: false
# §4 Windows round (2026-09-14). x64 ONLY: sherpa-onnx has no win-arm64 build and
# @firecrawl/anydoc has none either, so an arm64 target would ship an app whose voice
# and Documents features cannot load. arm64 Windows runs this under emulation.
win:
  target:
    - target: nsis
      arch: [x64]
  icon: build/icon.ico
  artifactName: HappyVibe-${version}-Setup.${ext}
nsis:
  oneClick: false
  perMachine: false                 # per-user: no UAC, which keeps the unsigned path bearable
  allowToChangeInstallationDirectory: true
  deleteAppDataOnUninstall: false   # sessions, audit log and memory are the user's data
# §4 Linux round (2026-09-20). x64 ONLY — and for a DIFFERENT reason than `win:`
# above, which is why the two are not collapsed into one comment. sherpa-onnx and
# @firecrawl/anydoc both publish linux-arm64, so arm64 is AVAILABLE here; it is
# excluded because nothing tests it. Windows arm64 unblocks when upstream ships a
# binary, Linux arm64 when we add a runner.
#
# Two targets because neither alone is honest: AppImage runs anywhere but needs
# libfuse2, absent by default on Ubuntu 22.04+, where a double-click does nothing
# with no error to read; the deb works out of the box and is the only one of the
# two that can declare its dependencies.
#
# There is deliberately NO `deb:` block. `deb.depends` REPLACES electron-builder's
# defaults instead of extending them (FpmTarget.js:185-194), and those defaults
# already include libsecret-1-0 — which is exactly what MCP OAuth's keychain needs
# — alongside libgtk-3-0 and libnss3. Adding the one line that looks like it fixes
# that would ship a package which installs cleanly and will not launch. Pinned by
# tests/linux-package.test.ts.
linux:
  target:
    - target: AppImage
      arch: [x64]
    - target: deb
      arch: [x64]
  # A rendered set (`npm run icons`), not electron-builder's downscale of the
  # macOS .icns — the artwork is a squircle with a face and 1024→16 muddies it.
  icon: build/icons
  category: Development
  synopsis: A desktop home for the Pi coding agent, with permissions you can see
  # THE double-icon-in-the-dock fix, and it is an ASSOCIATION bug rather than an
  # image one. Electron derives its app_id from `desktopName` in package.json;
  # with this true, electron-builder names the installed .desktop file AND
  # StartupWMClass from that same field, so a running window groups with its
  # launcher instead of raising a second generic icon beside it. electron-builder
  # #9103; its own default flips to true in v27. StartupWMClass is deliberately
  # NOT set by hand — it is derived, and a second copy could only drift.
  syncDesktopName: true
asarUnpack:
  # Native ONNX runtime — cannot be loaded from inside an asar archive.
  - "**/node_modules/sherpa-onnx-*/**"
afterPack: build/afterPack.mjs
# §38: where the updater looks, and where a release lands. DRAFT, because a draft
# is invisible to every running app — Publish is the one "go live" action, and a
# person presses it after reading the notes. This block is also what makes
# electron-builder write app-update.yml into the bundle and latest-*.yml beside
# the artifacts; without it the updater has nothing to read.
publish:
  provider: github
  owner: guiguito
  repo: HappyVibe
  releaseType: draft
